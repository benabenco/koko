<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown until we see each other again</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #db7093; /* Romantic PaleVioletRed background */
            color: #ffffff; /* Default text color for better contrast on red */
            overflow-x: hidden; /* Prevent horizontal scroll due to image movement */
        }

        #countdown-container {
            text-align: center;
            margin-bottom: 50px; /* Space between countdown and animation */
            /* Removed the transparent background here to simplify for the solid background */
        }

        #countdown-title {
            font-size: 1.2em;
            color: #f0f0f0; /* Lighter color for title */
            margin-bottom: 10px;
        }

        #countdown {
            font-size: 3em; /* Large text */
            font-weight: bold;
            color: #ffd700; /* Gold color for countdown for good contrast */
        }

        #countdown-message {
            font-size: 1.5em;
            font-weight: bold;
            color: #98fb98; /* Palegreen for the message */
            display: none; /* Hidden until countdown finishes */
        }

        /* Animation Container */
        #animation-line-container {
            width: 90%; /* Adjust width as needed */
            max-width: 800px; /* Max width to keep it reasonable */
            position: relative;
            height: 60px; /* Height for images */
            margin-top: 20px;
            display: flex;
            align-items: center;
        }

        .line {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 2px;
            background-color: #cccccc; /* Lighter line for contrast on red */
            transform: translateY(-50%);
            z-index: 1; /* Make sure line is behind images */
        }

        .moving-image {
            position: absolute;
            top: 50%;
            width: 50px; /* Adjust image width as needed, or let CSS resize your GIFs */
            height: auto;
            transform: translateY(-50%); /* Vertically center */
            z-index: 2; /* Images on top of line */
        }

        #image1 {
            left: var(--image1-offset, 0px); /* Custom property for left offset */
        }

        #image2 {
            right: var(--image2-offset, 0px); /* Custom property for right offset */
        }

        /* Small screen adjustments */
        @media (max-width: 768px) {
            #countdown {
                font-size: 2em;
            }
            #countdown-title {
                font-size: 1em;
            }
            .moving-image {
                width: 40px; /* Smaller images on small screens */
            }
        }
    </style>
</head>
<body>
    <div id="countdown-container">
        <p id="countdown-title">Countdown until we see each other again&lt;3</p>
        <div id="countdown"></div>
        <div id="countdown-message">The event has started!</div>
    </div>

    <div id="animation-line-container">
        <div class="line"></div>
        <!-- First GIF (UPDATED to the new link) -->
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcWs1amtxN3hhaGYzdHptd2F5ODh3d2x5d3g5dWxmZTV2M2t4ZjlxciZlcD12MV9naWZzX3NlYXJjaCZjdD1n/AXmgkbAArNg6A/giphy.gif" alt="Animated GIF 1" class="moving-image" id="image1">
        <!-- Second GIF (remains the same) -->
        <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3cG5lZnNldWIxZ3VmaTF0NGgzM3lwb3ZtZ2ZwbTdhYzVyMWRlY2JhbiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/Zl7u48zLVFgLpRwq6f/giphy.gif" alt="Animated GIF 2" class="moving-image" id="image2">
    </div>

    <script>
        // Target date and time (October 20, 2026, 19:30:00, GMT+2)
        // Using 'GMT+0200' explicitly defines the timezone offset.
        const targetDate = new Date('October 20, 2026 19:30:00 GMT+0200');

        const countdownElement = document.getElementById('countdown');
        const countdownMessage = document.getElementById('countdown-message');
        const image1 = document.getElementById('image1');
        const image2 = document.getElementById('image2');
        const animationContainer = document.getElementById('animation-line-container');

        // Store the initial time when the script loads.
        // This is used for the animation progress to ensure "right now they are farthest away"
        // and get closer as this specific page view session progresses.
        const initialLoadTime = new Date().getTime();
        // Calculate the total duration from initial load time to the target date.
        // This is the total time span for the animation in THIS session.
        let totalTimeSpanForAnimation = targetDate.getTime() - initialLoadTime;

        // Ensure totalTimeSpanForAnimation isn't zero or negative if the targetDate is in the past
        if (totalTimeSpanForAnimation <= 0) {
            totalTimeSpanForAnimation = 1; // Prevent division by zero or negative results, animation will snap to end.
        }

        function updateCountdown() {
            const now = new Date().getTime();
            let distance = targetDate.getTime() - now;

            // If the countdown is over
            if (distance < 0) {
                clearInterval(countdownInterval); // Stop the countdown
                countdownElement.style.display = 'none';
                countdownMessage.style.display = 'block';

                // Set images to meet exactly in the middle
                const containerWidth = animationContainer.offsetWidth;
                const img1Width = image1.offsetWidth > 0 ? image1.offsetWidth : 50; // Use actual width or default
                const img2Width = image2.offsetWidth > 0 ? image2.offsetWidth : 50;
                const centerOffset1 = (containerWidth / 2) - (img1Width / 2);
                const centerOffset2 = (containerWidth / 2) - (img2Width / 2);
                image1.style.setProperty('--image1-offset', `${centerOffset1}px`);
                image2.style.setProperty('--image2-offset', `${centerOffset2}px`);
                return; // Exit function
            }

            // Calculate days, hours, minutes, seconds, and milliseconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            const milliseconds = Math.floor(distance % 1000); // New line for milliseconds

            // Display the countdown
            // Add leading zeros to milliseconds to ensure it's always 3 digits
            const formattedMilliseconds = milliseconds.toString().padStart(3, '0');
            countdownElement.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s <span style="font-size: 0.8em;">${formattedMilliseconds}ms</span>`;


            // --- Animation Logic ---
            // Calculate elapsed time from the initial page load
            const currentElapsedTime = now - initialLoadTime;

            // Calculate animation progress (0 = start, 1 = end)
            let animationProgress = currentElapsedTime / totalTimeSpanForAnimation;

            // Clamp progress between 0 and 1
            animationProgress = Math.max(0, Math.min(1, animationProgress));

            // Get current dimensions (they might change if window is resized)
            const containerWidth = animationContainer.offsetWidth;
            // Get actual image widths for precise centering, or use CSS defined widths
            const img1Width = image1.offsetWidth > 0 ? image1.offsetWidth : 50;
            const img2Width = image2.offsetWidth > 0 ? image2.offsetWidth : 50;

            // Calculate the maximum distance each image needs to move from its edge to its center point at the container's center
            const maxMovement1 = (containerWidth / 2) - (img1Width / 2);
            const maxMovement2 = (containerWidth / 2) - (img2Width / 2);

            // Calculate current offset based on animation progress
            const currentOffset1 = animationProgress * maxMovement1;
            const currentOffset2 = animationProgress * maxMovement2;

            // Apply offsets using CSS custom properties (variables)
            image1.style.setProperty('--image1-offset', `${currentOffset1}px`);
            image2.style.setProperty('--image2-offset', `${currentOffset2}px`);
        }

        // Initial call to display the countdown and set animation state immediately
        updateCountdown();

        // Update the countdown and animation frequently (e.g., every 10 milliseconds)
        const countdownInterval = setInterval(updateCountdown, 10); // Changed to 10ms for milliseconds display

        // Optional: Re-calculate animation state if the window is resized
        window.addEventListener('resize', updateCountdown);
    </script>
</body>
</html>
